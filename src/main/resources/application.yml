spring:
  application:
    name: subscribe-master
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/subscribe_master}
    username: ${DB_USERNAME:subscribe}
    password: ${DB_PASSWORD:subscribe}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cache:
    type: caffeine
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-secret-key}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
resilience4j:
  circuitbreaker:
    instances:
      cbu:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  timelimiter:
    instances:
      cbu:
        timeoutDuration: 3s
springdoc:
  swagger-ui:
    path: /swagger-ui.html
