databaseChangeLog:

  - changeSet:
      id: 002-create-subscriptions
      author: subscribe-master
      changes:

        - createTable:
            tableName: subscriptions
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: next_payment_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: periodicity
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: category
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    referencedTableName: users
                    referencedColumnNames: id
                    foreignKeyName: fk_subscription_user

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: subscriptions
            indexName: idx_sub_user_deleted
            columns:
              - column:
                  name: user_id
              - column:
                  name: is_deleted

        - createIndex:
            tableName: subscriptions
            indexName: idx_sub_next_payment
            columns:
              - column:
                  name: next_payment_date