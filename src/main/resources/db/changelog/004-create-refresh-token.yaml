databaseChangeLog:
  - changeSet:
      id: 004-create-refresh-token
      author: subscribe-master
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - { column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } } }
              - { column: { name: token, type: VARCHAR(512), constraints: { nullable: false, unique: true } } }
              - { column: { name: user_id, type: BIGINT, constraints: { nullable: false, referencedTableName: users, referencedColumnNames: id, foreignKeyName: fk_refresh_user } } }
              - { column: { name: expiry_date, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } } }
        - createIndex: { tableName: refresh_tokens, indexName: idx_refresh_user, columns: [ { column: { name: user_id } } ] }
