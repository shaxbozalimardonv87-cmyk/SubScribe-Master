databaseChangeLog:
  - changeSet:
      id: 003-create-payment-history
      author: subscribe-master
      changes:
        - createTable:
            tableName: payment_history
            columns:
              - { column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } } }
              - { column: { name: subscription_id, type: BIGINT, constraints: { nullable: false, referencedTableName: subscriptions, referencedColumnNames: id, foreignKeyName: fk_payment_subscription } } }
              - { column: { name: amount, type: "DECIMAL(19,4)", constraints: { nullable: false } } }
              - { column: { name: currency, type: VARCHAR(10), constraints: { nullable: false } } }
              - { column: { name: payment_date, type: DATE, constraints: { nullable: false } } }
              - { column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } } }
              - { column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } } }
        - createIndex: { tableName: payment_history, indexName: idx_payment_subscription_date, columns: [ { column: { name: subscription_id } }, { column: { name: payment_date } } ] }
